services:
  postgres:
    image: postgres:17-alpine
    container_name: signalhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: signalhub
      POSTGRES_PASSWORD: signalhub
      POSTGRES_DB: signalhub
    ports:
      - "5432:5432"
    volumes:
      - signalhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalhub -d signalhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signalhub_postgres_data:
